name: 🤖 Generate Debiolle demo assistant (manual, prod)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the Debiolle Patrick assistant on prod (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/api.devleadhunter.dibodev.fr/html/api
            ../.venv/bin/python - <<'PY'
            import importlib
            import pkgutil

            import models
            from sqlalchemy.orm import configure_mappers

            for _m in pkgutil.iter_modules(models.__path__):
                importlib.import_module(f"models.{_m.name}")
            configure_mappers()

            from core.database import SessionLocal
            from models.ai_assistant import AiAssistant
            from models.demo_site import DemoSite
            from models.prospect_db import ProspectDB
            from services.ai_assistant.assistant_service import ai_assistant_service

            db = SessionLocal()
            try:
                # Already got one from a previous run? Reuse it (idempotent, no duplicate).
                existing_any = db.query(AiAssistant).filter(AiAssistant.deleted_at.is_(None)).first()
                if existing_any is not None:
                    print("ALREADY EXISTS", existing_any.slug, "|", existing_any.business_name)
                    raise SystemExit(0)

                # Pick the first active demo site with a real prospect and >= 3 services.
                site = None
                prospect = None
                for candidate in db.query(DemoSite).all():
                    c = candidate.content_json or {}
                    svc = [s.get("title") for s in (c.get("services") or []) if isinstance(s, dict) and s.get("title")]
                    if len(svc) < 3 or candidate.prospect_id is None:
                        continue
                    p = db.query(ProspectDB).filter(ProspectDB.id == candidate.prospect_id).first()
                    if p is None:
                        continue
                    site, prospect = candidate, p
                    break
                if site is None or prospect is None:
                    print("NO SUITABLE DEMO SITE on prod")
                    raise SystemExit(0)

                content = site.content_json or {}
                services = [s.get("title") for s in (content.get("services") or []) if isinstance(s, dict) and s.get("title")]
                opening_hours = [
                    {"day": h.get("day"), "hours": h.get("hours") or h.get("value") or ""}
                    for h in (content.get("openingHours") or [])
                    if isinstance(h, dict) and h.get("day")
                ]
                reviews = [
                    {"text": r.get("text") or r.get("quote"), "author": r.get("author"), "rating": r.get("rating")}
                    for r in (content.get("reviews") or [])
                    if isinstance(r, dict) and (r.get("text") or r.get("quote"))
                ]
                social = content.get("social")
                enrichment = {
                    "logo_url": content.get("logo"),
                    "rating": None,
                    "reviews_count": None,
                    "description": content.get("about"),
                    "photos": [],
                    "reviews": reviews,
                    "opening_hours": opening_hours,
                    "services": services,
                    "social_links": social if isinstance(social, dict) else {},
                    "photo_labels": {},
                }

                assistant = ai_assistant_service.create(
                    db,
                    user_id=prospect.user_id,
                    prospect_id=prospect.id,
                    business_name=prospect.name,
                    city=prospect.city,
                    address=prospect.address,
                    phone=prospect.phone,
                    email=prospect.email,
                    country=getattr(prospect, "country", None),
                    logo_url=content.get("logo"),
                    enrichment=enrichment,
                )
                print("CREATED", assistant.slug, "|", assistant.business_name, "| services:", len(services))
            finally:
                db.close()
            PY
