name: 🔍 Debug API service logs (manual)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: 📜 Dump service status and recent logs (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== systemctl status ====="
            sudo systemctl status devleadhunter-api.service --no-pager -l || true
            echo "===== last 120 journal lines ====="
            sudo journalctl -u devleadhunter-api.service -n 120 --no-pager || true
            echo "===== domain/recovery lines, last 30 min ====="
            sudo journalctl -u devleadhunter-api.service --since "30 min ago" --no-pager 2>/dev/null | grep -iE "apex re-point|removed apex|DNS re-point|point_to_vercel|domain_provision|recovery|kept in DEPLOYING|devleadhunter|ovh" | tail -60 || true
            echo "===== local port check ====="
            curl -s -o /dev/null -w "localhost:8005 -> %{http_code}\n" http://127.0.0.1:8005/docs || true
            echo "===== memory ====="
            free -m || true
            echo "===== top 15 processes by memory ====="
            ps -eo pid,ppid,rss,%mem,%cpu,comm,args --sort=-rss 2>/dev/null | head -16 || true
            echo "===== is MySQL local? ====="
            (systemctl is-active mysql 2>/dev/null || systemctl is-active mariadb 2>/dev/null || echo "no local mysql/mariadb service") || true
            echo "===== stray chromium/chrome/ffmpeg? ====="
            pgrep -af 'chrom|ffmpeg|nodriver|playwright' 2>/dev/null | head -20 || echo "none"
            echo "===== database connection errors, last 7 days, per hour (UTC) ====="
            sudo journalctl -u devleadhunter-api.service --since "7 days ago" --no-pager 2>/dev/null | grep -E "Name or service not known|server has gone away|Lost connection to MySQL|Too many connections|QueuePool limit" | grep -oE "^[A-Z][a-z]{2} [ 0-9]{2} [0-9]{2}|Name or service not known|server has gone away|Lost connection to MySQL|Too many connections|QueuePool limit" | paste -d' ' - - | sort | uniq -c | tail -60 || true
            echo "===== name resolution of the database host, now ====="
            DB_HOST=$(sudo grep -E "^DATABASE_URL=" /var/www/api.devleadhunter.dibodev.fr/html/api/.env 2>/dev/null | grep -oE "@[^:/@]+" | tail -1 | tr -d '@')
            echo "database host: ${DB_HOST:-unknown}"
            for attempt in 1 2 3 4 5; do getent hosts "${DB_HOST:-nombre.o2switch.net}" || echo "attempt $attempt: resolution failed"; done
            echo "===== resolver configuration ====="
            grep -vE "^#|^$" /etc/resolv.conf 2>/dev/null || true
            grep -E "^hosts:" /etc/nsswitch.conf 2>/dev/null || true
            (resolvectl status 2>/dev/null || systemd-resolve --status 2>/dev/null) | grep -E "Current DNS|DNS Servers|Fallback|resolv.conf mode" | head -10 || true
            systemctl show systemd-resolved -p ActiveState -p NRestarts -p ActiveEnterTimestamp 2>/dev/null || true
            echo "===== processes killed for lack of memory, last 3 days, per hour (UTC) ====="
            sudo journalctl -k --since "3 days ago" --no-pager 2>/dev/null | grep "Killed process" | grep -oE "^[A-Z][a-z]{2} [ 0-9]{2} [0-9]{2}" | sort | uniq -c | tail -72 || true
            echo "===== services whose process was killed, last 3 days ====="
            sudo journalctl -k --since "3 days ago" --no-pager 2>/dev/null | grep -oE "task_memcg=[^,]+" | sort | uniq -c || true
            echo "===== resolver and network events, last 3 days ====="
            sudo journalctl --since "3 days ago" --no-pager 2>/dev/null | grep -iE "systemd-resolved|degraded feature set|link is not managed|carrier|dhcp" | tail -30 || true
            echo "===== pneumo-api service ====="
            systemctl show pneumo-api -p ActiveState -p NRestarts -p Restart -p RestartUSec -p MemoryMax -p ExecStart 2>/dev/null | cut -c1-300 || true
            echo "===== memory pressure ====="
            cat /proc/pressure/memory 2>/dev/null || true
            uptime || true
            echo "===== top memory cgroups ====="
            sudo systemd-cgtop -b -n 1 -m 2>/dev/null | head -25 || true
