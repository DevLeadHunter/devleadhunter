name: 🤖 Réceptionniste IA pour une entreprise (manuel, prod)

# Crée (ou retrouve) un prospect du compte propriétaire et lui génère sa réceptionniste sur la prod, par les
# mêmes routes que le dashboard. Sert à tester le parcours client complet sur une entreprise réelle (la nôtre)
# sans jeton de prod dans une session. Idempotent : un prospect du même nom et son assistant sont réutilisés.

on:
  workflow_dispatch:
    inputs:
      business_name:
        description: "Nom de l'entreprise (tel qu'il s'affiche)"
        required: true
      website:
        description: "Site de l'entreprise (https://…), lu pour la base de connaissance"
        required: false
        default: ""
      phone:
        description: "Téléphone de l'entreprise"
        required: false
        default: ""
      email:
        description: "E-mail de l'entreprise (reçoit la démo et les alertes)"
        required: false
        default: ""
      city:
        description: "Ville"
        required: false
        default: "Rennes"
      country:
        description: "Pays (FR, BE, CH, LU)"
        required: false
        default: "FR"
      category:
        description: "Métier / catégorie Google"
        required: false
        default: "Agence web"
      owner_email:
        description: "Compte DevLeadHunter propriétaire du prospect"
        required: false
        default: "contact@dibodev.fr"
      list_templates:
        description: "Lister les modèles d'e-mail du compte (id, nom) sans rien envoyer"
        required: false
        type: boolean
        default: false
      template_id:
        description: "Envoyer la démo tout de suite avec ce modèle d'e-mail (id), par une campagne d'un prospect"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Créer le prospect et sa réceptionniste sur la prod (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/api.devleadhunter.dibodev.fr/html/api
            ../.venv/bin/python - <<'PY'
            import json
            from datetime import timedelta

            import httpx

            from services.auth_service import AuthService

            API = "http://127.0.0.1:8005/api/v1"
            # The workflow inputs, substituted by GitHub before the script leaves the runner.
            inputs = json.loads('''${{ toJSON(inputs) }}''')
            owner = inputs["owner_email"].strip()
            name = inputs["business_name"].strip()
            # Un jeton court, minté sur place, jamais imprimé : les routes du dashboard font le reste.
            token = AuthService.create_access_token({"sub": owner}, expires_delta=timedelta(minutes=30))
            client = httpx.Client(base_url=API, headers={"Authorization": f"Bearer {token}"}, timeout=900)

            prospects = client.get("/prospects").json()
            rows = prospects.get("prospects", prospects) if isinstance(prospects, dict) else prospects
            prospect = next((p for p in rows if str(p.get("name", "")).strip().lower() == name.lower()), None)
            if prospect is not None:
                print("PROSPECT EXISTS id=%s" % prospect["id"])
            else:
                created = client.post(
                    "/prospects",
                    json={
                        "name": name,
                        "city": inputs["city"].strip() or None,
                        "country": inputs["country"].strip() or "FR",
                        "phone": inputs["phone"].strip() or None,
                        "email": inputs["email"].strip() or None,
                        "website": inputs["website"].strip() or None,
                        "category": inputs["category"].strip() or "Entreprise",
                        "source": "manual",
                        "confidence": 1,
                    },
                )
                created.raise_for_status()
                prospect = created.json()
                print("PROSPECT CREATED id=%s" % prospect["id"])

            listing = client.get("/ai-assistants", params={"prospect_id": prospect["id"]}).json()
            assistants = listing.get("assistants", listing) if isinstance(listing, dict) else listing
            if assistants:
                assistant = assistants[0]
                print("ASSISTANT EXISTS id=%s" % assistant["id"])
            else:
                generated = client.post("/ai-assistants", json={"prospect_id": prospect["id"]})
                generated.raise_for_status()
                assistant = generated.json()
                print("ASSISTANT CREATED id=%s" % assistant["id"])
            print("RESULT slug=%s name=%s status=%s demo_url=%s" % (
                assistant["slug"], assistant["assistant_name"], assistant["status"], assistant["demo_url"]
            ))

            if str(inputs.get("list_templates", "")).lower() == "true":
                for template in client.get("/email-templates").json():
                    print("TEMPLATE id=%s active=%s name=%s" % (template["id"], template["is_active"], template["name"]))

            template_id = str(inputs.get("template_id", "")).strip()
            if template_id:
                # The real journey: a one-prospect campaign with the chosen model, launched, then the email sent
                # at once (the queue alone would wait for the sending window). The campaign is reused by name.
                campaign_name = "Parcours client — %s" % name
                campaigns = client.get("/campaigns", params={"limit": 200}).json().get("campaigns", [])
                existing = next((c for c in campaigns if c.get("name") == campaign_name), None)
                if existing is not None:
                    campaign_id = existing["id"]
                    print("CAMPAIGN EXISTS id=%s status=%s" % (campaign_id, existing.get("status")))
                else:
                    campaign = client.post(
                        "/campaigns",
                        json={
                            "name": campaign_name,
                            "description": "Test du parcours client complet sur une entreprise réelle.",
                            "prospect_ids": [prospect["id"]],
                            "template_id": int(template_id),
                            "send_delay_minutes": 1,
                            "max_emails_per_day": 5,
                        },
                    )
                    campaign.raise_for_status()
                    campaign_id = campaign.json()["id"]
                    print("CAMPAIGN CREATED id=%s" % campaign_id)
                launched = client.post(
                    "/campaigns/%s/launch" % campaign_id,
                    json={"template_id": int(template_id), "send_delay_minutes": 1},
                )
                print("CAMPAIGN LAUNCH status=%s body=%s" % (launched.status_code, launched.text[:200]))
                sent = client.post(
                    "/campaigns/%s/send-now" % campaign_id,
                    json={"prospect_id": prospect["id"], "template_id": int(template_id)},
                )
                print("CAMPAIGN SEND-NOW status=%s body=%s" % (sent.status_code, sent.text[:300]))
            PY
