name: 🚑 Recover API (restart)

# Manual recovery for the case where the API is stuck or was taken down by the OOM killer:
# systemctl restart kills the whole cgroup (uvicorn + any lingering child process), then the
# local health check confirms the API answers again.

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: 🔁 Restart service (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            SERVICE_NAME="devleadhunter-api.service"

            echo "===== memory before ====="
            free -m || true

            echo "===== restart service (kills the whole cgroup) ====="
            sudo systemctl restart "$SERVICE_NAME"

            echo "===== wait for local health ====="
            for attempt in $(seq 1 18); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8005/docs || true)
              if [ "$code" = "200" ]; then
                echo "API up (HTTP $code) after ${attempt} attempt(s)."
                break
              fi
              sleep 5
            done

            echo "===== memory after ====="
            free -m || true
