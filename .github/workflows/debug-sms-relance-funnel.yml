name: 🔎 Debug SMS relance funnel (manual, read-only)

on:
  workflow_dispatch:

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - name: 📉 Print the J+30 SMS relance eligibility funnel (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/api.devleadhunter.dibodev.fr/html/api
            ../.venv/bin/python - <<'PY'
            import importlib
            import pkgutil

            import models
            from sqlalchemy import select
            from sqlalchemy.orm import configure_mappers

            for _m in pkgutil.iter_modules(models.__path__):
                importlib.import_module(f"models.{_m.name}")
            configure_mappers()

            from core.database import SessionLocal
            from models.email_log import EmailLog
            from models.prospect_db import ProspectDB
            from models.sms_auto_queue import SmsAutoQueue
            from models.sms_config import SmsConfig
            from models.sms_message import SmsMessage
            from services.sms.send_window import utc_to_paris_naive
            from services.sms.phone_normalizer import is_mobile_fr, to_e164_fr
            from services.sms.smsmode_provider import smsmode_provider
            from services.sms_relance_service import sms_relance_service
            from services.sms_service import sms_service

            db = SessionLocal()
            print("smsmode configured (SMSMODE_API_KEY present):", smsmode_provider.is_configured)
            try:
                configs = db.query(SmsConfig).all()
                if not configs:
                    print("No SmsConfig row at all.")
                for cfg in configs:
                    uid = cfg.user_id
                    print(f"\n=== user {uid} — sender={cfg.sender!r} auto_relance={cfg.auto_relance_enabled} "
                          f"cold={cfg.cold_sms_enabled} after_days={cfg.auto_relance_after_days} ===")

                    unreplied = db.execute(
                        select(EmailLog.prospect_id)
                        .where(
                            EmailLog.user_id == uid,
                            EmailLog.prospect_id.isnot(None),
                            EmailLog.sent_at.isnot(None),
                            EmailLog.replied_at.is_(None),
                        )
                        .group_by(EmailLog.prospect_id)
                    ).all()
                    ids = {r[0] for r in unreplied}
                    prospects = db.query(ProspectDB).filter(ProspectDB.id.in_(ids)).all() if ids else []
                    texted = {r[0] for r in db.execute(select(SmsMessage.prospect_id).where(SmsMessage.user_id == uid)).all()}

                    def is_supp(p):
                        e = to_e164_fr(p.phone)
                        return bool(e and sms_service.is_suppressed(db, uid, e))

                    has_phone = [p for p in prospects if (p.phone or "").strip()]
                    mobile = [p for p in has_phone if is_mobile_fr(p.phone)]
                    never_texted = [p for p in mobile if p.id not in texted]
                    not_blocked = [p for p in never_texted if not p.do_not_contact and not p.sms_auto_excluded]
                    not_supp = [p for p in not_blocked if not is_supp(p)]
                    reachable = [p for p in not_supp if sms_relance_service.demo_for_prospect(db, uid, p.id) is not None]

                    print(f"  emailed & no reply : {len(ids)}")
                    print(f"  + has a phone      : {len(has_phone)}")
                    print(f"  + mobile 06/07     : {len(mobile)}")
                    print(f"  + never SMSed      : {len(never_texted)}")
                    print(f"  + not blocked      : {len(not_blocked)}")
                    print(f"  + not suppressed   : {len(not_supp)}")
                    print(f"  + reachable demo   : {len(reachable)}  <= manual final")
                    projection = sms_relance_service.find_relance_projection_candidates(db, uid, limit=2000)
                    print(f"  find_relance_projection_candidates() : {len(projection)}  <= real finder")

                    for p in mobile:
                        e164 = to_e164_fr(p.phone)
                        demo = sms_relance_service.demo_for_prospect(db, uid, p.id)
                        cand = sms_relance_service._build_candidate(db, uid, p, emailed_at=None, cold=False)
                        print(
                            f"    #{p.id} {p.name} ☎{p.phone} e164={e164!r} texted={p.id in texted} "
                            f"dnc={p.do_not_contact} excl={p.sms_auto_excluded} supp={is_supp(p)} "
                            f"demo={'yes' if demo else 'NO'} build={'OK' if cand else 'None'}"
                        )

                    planned = (
                        db.query(SmsAutoQueue)
                        .filter(SmsAutoQueue.user_id == uid)
                        .order_by(SmsAutoQueue.scheduled_at.asc())
                        .all()
                    )
                    print(f"\n  --- planned auto-SMS queue: {len(planned)} row(s) ---")
                    for row in planned[:50]:
                        who = db.query(ProspectDB).filter(ProspectDB.id == row.prospect_id).first()
                        paris = utc_to_paris_naive(row.scheduled_at)
                        label = who.name if who else f"prospect {row.prospect_id}"
                        print(f"    [{row.status}] {row.kind:7s} {paris:%a %d/%m %H:%M} Paris — {label} {row.skip_reason or ''}")

                    from services.sms_auto_campaign_service import sms_auto_campaign_service

                    system_campaign = sms_auto_campaign_service.get(db, uid)
                    if system_campaign is None:
                        print("\n  --- system campaign: none ---")
                    else:
                        linked = sum(1 for row in planned if row.campaign_id == system_campaign.id)
                        print(
                            f"\n  --- system campaign #{system_campaign.id} « {system_campaign.name} » "
                            f"status={getattr(system_campaign.status, 'value', system_campaign.status)} "
                            f"template={system_campaign.sms_template_key!r} "
                            f"prospects={len(system_campaign.prospects)} linked_rows={linked} ---"
                        )
            finally:
                db.close()
            PY
