[package]
name = "devleadhunter-desktop"
version = "0.1.0"
description = "DevLeadHunter Desktop (Nuxt + Tauri)"
authors = ["DevLeadHunter"]
edition = "2021"

[lib]
name = "devleadhunter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["devtools", "tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
# The app starts with Windows, hidden in the notification area, and runs once: a prospect
# search launched from the iPad finds it ready to read its Facebook pages.
# Their next minors require tauri 2.12, whose wry no longer matches webview2-com 0.38 below.
tauri-plugin-autostart = "~2.5"
tauri-plugin-single-instance = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Jeton du sidecar : il doit venir du CSPRNG de l'OS, pas de l'horloge.
getrandom = "0.3"
# Loads api/.env.sync + web/.env.sync for the debug-only prod → local DB sync command.
dotenvy = "0.15"

# Grants the WebView2 camera/microphone permission so the in-app presenter-clip
# recorder works in the desktop build. wry only auto-allows clipboard reads.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
