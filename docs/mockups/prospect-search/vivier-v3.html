<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette · Vivier de leads (v3)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f1e9; --sheet: #fbf9f3; --tint: #ede9de; --ink: #1d1a14; --soft: #6e6759; --faint: #b7ae9c;
        --line: #e1dbcc; --line-soft: #eae5d8; --amber: #e8a33c; --amber-ink: #9c6b14; --amber-soft: rgba(232, 163, 60, 0.14);
        --green: #2f7d4e; --green-soft: rgba(47, 125, 78, 0.12); --red: #bf4d33; --red-soft: rgba(191, 77, 51, 0.12);
        --btn: #1d1a14; --btn-text: #fbf9f3; --hover: rgba(29, 26, 20, 0.045);
        --pop: 0 24px 48px -18px rgba(29, 26, 20, 0.28), 0 0 0 1px rgba(29, 26, 20, 0.08);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      :root[data-theme='dark'] {
        --bg: #131312; --sheet: #1b1b1a; --tint: #242423; --ink: #f0efeb; --soft: #a1a09a; --faint: #565550;
        --line: #2b2b29; --line-soft: #232322; --amber-ink: #ecb865; --amber-soft: rgba(232, 163, 60, 0.13);
        --green: #55a878; --green-soft: rgba(85, 168, 120, 0.15); --red: #d76a55; --red-soft: rgba(215, 106, 85, 0.15);
        --btn: #f0efeb; --btn-text: #131312; --hover: rgba(240, 239, 235, 0.05);
        --pop: 0 24px 48px -18px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(240, 239, 235, 0.08);
      }
      * { box-sizing: border-box; margin: 0; }
      body { display: flex; flex-direction: column; height: 100vh; background: var(--bg); color: var(--ink); font: 14px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .label { font: 500 11px/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
      .soft { color: var(--soft); }
      svg { width: 16px; height: 16px; flex: none; }

      .mock-bar { flex: none; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; background: #111; color: #f3f3f0; font-size: 13px; }
      .mock-switch { display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: #262624; }
      .mock-switch button { padding: 4px 11px; border-radius: 999px; color: #b9b8b2; font-weight: 500; }
      .mock-switch button[aria-pressed='true'] { background: #f3f3f0; color: #111; }
      .mock-note { margin-left: auto; color: #a8a7a1; }

      .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
      .side { display: flex; flex-direction: column; padding: 14px 10px 12px 12px; overflow: auto; }
      .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; font-weight: 600; }
      .side .label { padding: 12px 8px 5px; }
      .nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px; border-radius: 8px; color: var(--soft); text-align: left; }
      .nav:hover { background: var(--hover); }
      .nav.is-active { background: var(--sheet); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
      .count { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-ink); font: 500 11px/1.5 'IBM Plex Mono', monospace; text-align: center; }
      .task { margin-top: auto; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); text-align: left; width: 100%; }
      .task b { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      .pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
      .pulse.is-live::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green); animation: ping 1.4s var(--ease) infinite; }
      @keyframes ping { to { transform: scale(2.6); opacity: 0; } }
      .bar { display: block; height: 5px; margin-top: 9px; border-radius: 999px; background: var(--tint); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 999px; background: var(--ink); transition: width 0.4s var(--ease); }

      .sheet { display: flex; flex-direction: column; margin: 8px 8px 8px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); overflow: hidden; transition: margin 0.3s var(--ease); }
      body.has-drawer .sheet { margin-right: 448px; }
      .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-height: 60px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
      .head h1 { font-size: 17px; font-weight: 500; }
      .head .right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 500; white-space: nowrap; transition: opacity 0.15s, transform 0.15s; }
      .btn:active { transform: translateY(1px); }
      .btn.primary { background: var(--btn); color: var(--btn-text); font-weight: 600; }
      .btn.secondary { border: 1px solid var(--line); background: var(--sheet); }
      .btn.ghost { color: var(--soft); }
      .seg { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
      .seg button { height: 26px; padding: 0 11px; border-radius: 999px; color: var(--soft); font-size: 13px; font-weight: 500; }
      .seg button[aria-pressed='true'] { background: var(--tint); color: var(--ink); }
      .scroll { flex: 1; overflow: auto; }

      .live { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
      .live .what { display: flex; align-items: center; gap: 9px; font-weight: 500; }
      .live .now { flex: 1; min-width: 200px; color: var(--soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live .bar { flex: 0 0 160px; margin: 0; }
      .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
      .metric { padding: 14px 20px; border-right: 1px solid var(--line-soft); }
      .metric:last-child { border-right: 0; }
      .metric b { display: block; font: 500 24px/1.15 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
      .metric span { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--soft); font-size: 12.5px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; min-height: 48px; padding: 0 20px; border-bottom: 1px solid var(--line); }
      .tab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 48px; color: var(--soft); font-weight: 500; }
      .tab[aria-selected='true'] { color: var(--ink); }
      .tab[aria-selected='true']::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
      .tab em { padding: 0 6px; border-radius: 999px; background: var(--tint); font: 500 11px/1.6 'IBM Plex Mono', monospace; font-style: normal; }
      .hint { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--soft); font-size: 12.5px; }
      kbd { padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); font: 500 11px/1.7 'IBM Plex Mono', monospace; color: var(--soft); }

      .fresh { display: flex; justify-content: center; padding: 8px; border-bottom: 1px solid var(--line-soft); background: var(--amber-soft); }
      .fresh button { display: inline-flex; align-items: center; gap: 8px; color: var(--amber-ink); font-weight: 500; }
      .cols, .row { display: grid; grid-template-columns: minmax(200px, 1.7fr) minmax(190px, 1.4fr) 138px 84px minmax(120px, 1fr) 104px; align-items: center; gap: 12px; padding: 0 20px 0 17px; }
      .cols { height: 36px; border-bottom: 1px solid var(--line-soft); background: color-mix(in srgb, var(--tint) 55%, transparent); border-left: 3px solid transparent; }
      .row { min-height: 58px; border-bottom: 1px solid var(--line-soft); border-left: 3px solid var(--faint); cursor: pointer; transition: background 0.15s; }
      .row:hover { background: var(--hover); }
      .row.is-open { background: var(--tint); }
      .row.q-full { border-left-color: var(--green); }
      .row.q-check { border-left-color: var(--amber); }
      .row.is-new { animation: arrive 1.6s var(--ease); }
      @keyframes arrive { from { background: var(--amber-soft); transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; transform: none; } to { background: transparent; } }
      .who { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .mono-avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border: 1px solid var(--line); border-radius: 50%; background: var(--tint); font: 600 11px 'IBM Plex Sans', sans-serif; letter-spacing: 0.02em; }
      .cell { min-width: 0; }
      .cell > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cell > .pill { display: inline-flex; }
      .cell small, .who small { display: block; color: var(--soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name { font-weight: 600; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--tint); color: var(--soft); font-size: 12px; font-weight: 500; white-space: nowrap; }
      .pill.full { background: var(--green-soft); color: var(--green); }
      .pill.check { background: var(--amber-soft); color: var(--amber-ink); }
      .pill.no { background: var(--red-soft); color: var(--red); }
      .acts { display: flex; justify-content: flex-end; gap: 6px; }
      .round { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); transition: transform 0.12s, background 0.15s; }
      .round:hover { transform: scale(1.06); }
      .round.yes { border-color: var(--btn); background: var(--btn); color: var(--btn-text); }
      .empty { padding: 56px 20px; text-align: center; color: var(--soft); }
      .empty i { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%; background: var(--tint); color: var(--ink); }
      .empty b { display: block; color: var(--ink); font-size: 15px; font-weight: 500; }

      .drawer { position: fixed; top: var(--bar-height, 60px); right: 8px; bottom: 8px; z-index: 30; display: flex; flex-direction: column; width: 432px; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); transform: translateX(calc(100% + 16px)); transition: transform 0.3s var(--ease); }
      body.has-drawer .drawer { transform: none; }
      .drawer header { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
      .drawer h2 { font-size: 16px; font-weight: 600; }
      .drawer .body { flex: 1; overflow: auto; padding: 6px 18px 16px; }
      .fact { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
      .fact svg { margin-top: 2px; color: var(--soft); }
      .fact a { color: inherit; text-underline-offset: 2px; }
      .drawer footer { padding: 12px 18px 14px; border-top: 1px solid var(--line); }
      .drawer .choice { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
      .drawer .choice .btn { height: 42px; padding: 0 8px; }
      .drawer .keys { display: flex; justify-content: space-between; margin-top: 10px; color: var(--soft); font-size: 12px; }
      .done { display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-weight: 500; }

      .toast { position: fixed; left: 50%; bottom: 22px; z-index: 70; display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--btn); color: var(--btn-text); box-shadow: var(--pop); transform: translate(-50%, 80px); opacity: 0; transition: transform 0.3s var(--ease), opacity 0.2s; }
      .toast.is-on { transform: translate(-50%, 0); opacity: 1; }
      .toast button { padding: 3px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--btn-text) 35%, transparent); color: var(--btn-text); font-weight: 500; }

      .dock { position: fixed; right: 20px; bottom: 20px; z-index: 40; width: 340px; border-radius: 14px; background: var(--sheet); box-shadow: var(--pop); overflow: hidden; }
      .dock header { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 14px; text-align: left; font-weight: 500; }
      .dock header .mono { margin-left: auto; color: var(--soft); font-size: 12px; }
      .dock .lead { padding: 12px 14px 14px; border-top: 1px solid var(--line); animation: arrive 1.2s var(--ease); }
      .dock .lead .btn { flex: 1; height: 38px; }
      .dock .more { display: block; width: 100%; padding: 9px 14px; border-top: 1px solid var(--line-soft); color: var(--soft); font-size: 12.5px; text-align: left; }
      .ghost-page { padding: 22px 20px; }
      .ghost-page .sk { height: 46px; margin-top: 8px; border-radius: 8px; background: var(--tint); opacity: 0.6; }

      @media (max-width: 1240px) {
        .cols, .row { grid-template-columns: minmax(180px, 1.5fr) minmax(170px, 1.2fr) minmax(110px, 0.8fr) 96px; }
        .c-phone, .c-note { display: none; }
        body.has-drawer .cols, body.has-drawer .row { grid-template-columns: minmax(0, 1fr) 96px; }
        body.has-drawer .c-mail, body.has-drawer .c-quality { display: none; }
        .hint { display: none; }
      }
      @media (max-width: 860px) {
        body { height: auto; }
        .app { grid-template-columns: 1fr; }
        .side { display: none; }
        .sheet, body.has-drawer .sheet { margin: 8px; }
        .cols { display: none; }
        .row, body.has-drawer .row { grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px 10px 11px; }
        .c-mail, .c-quality { display: none; }
        .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .metric:nth-child(n + 4) { border-top: 1px solid var(--line-soft); }
        .metric:nth-child(3) { border-right: 0; }
        .drawer { left: 8px; width: auto; }
      }
    </style>
  </head>
  <body>
    <div class="mock-bar">
      <strong>Maquette · Vivier de leads</strong>
      <div class="mock-switch" id="page-switch">
        <button data-page="vivier" aria-pressed="true">Page Vivier</button>
        <button data-page="other" aria-pressed="false">Une autre page</button>
      </div>
      <div class="mock-switch" id="theme-switch">
        <button data-theme="light" aria-pressed="true">Clair</button>
        <button data-theme="dark" aria-pressed="false">Sombre</button>
      </div>
      <button class="btn" id="replay" style="height:28px;border:1px solid #3a3a37;color:#f3f3f0">Rejouer la recherche</button>
      <span class="mock-note">Les leads arrivent tout seuls. Acceptez, refusez, changez de page.</span>
    </div>

    <div class="app">
      <aside class="side">
        <div class="brand"><i data-lucide="hexagon"></i> devleadhunter</div>
        <p class="label">Pilotage</p>
        <button class="nav"><i data-lucide="layout-dashboard"></i> Tableau de bord</button>
        <button class="nav"><i data-lucide="workflow"></i> Automatisations</button>
        <p class="label">Prospection</p>
        <button class="nav" data-page="vivier" id="nav-vivier"><i data-lucide="inbox"></i> Vivier <span class="count" id="nav-count"></span></button>
        <button class="nav"><i data-lucide="users"></i> Mes prospects</button>
        <button class="nav"><i data-lucide="app-window"></i> Sites démo</button>
        <button class="nav" data-page="other" id="nav-other"><i data-lucide="megaphone"></i> Campagnes</button>
        <button class="nav"><i data-lucide="send"></i> Suivi des emails</button>
        <button class="nav"><i data-lucide="banknote"></i> Ventes</button>
        <button class="task" data-page="vivier" id="task"></button>
      </aside>
      <main class="sheet" id="sheet"></main>
    </div>

    <aside class="drawer" id="drawer" aria-label="Fiche du lead"></aside>
    <div class="dock" id="dock" hidden></div>
    <div class="toast" id="toast" role="status"></div>

      const TRADE = { paysagiste: 'Paysagiste', electricien: 'Électricien' }
      const PROOF = { a: 'publié par le pro', b: 'donné par un annuaire', c: 'sans preuve franche' }

      const QUALITY = { kept: 'full', to_confirm: 'check', set_aside: 'part', rejected: 'none' }

      let leads, queue, buffer, page = 'vivier', tab = 'pending', openId = null, auto = false, checked, timer, lastAction = null, dockOpen = true

      function reset() {

        if (openId === null) document.body.classList.remove('has-drawer')
        render()

            <div class="toolbar" role="tablist">${TABS.map(([key, title]) => `<button class="tab" role="tab" data-tab="${key}" aria-selected="${key === tab}">${title}<em>${inPlace(key).length}</em></button>`).join('')}
              <span class="hint"><kbd>A</kbd> accepter <kbd>R</kbd> refuser <kbd>S</kbd> de côté <kbd>↑</kbd><kbd>↓</kbd> <kbd>Z</kbd> annuler</span></div>
            ${buffer.length ? `<div class="fresh"><button data-flush><i data-lucide="arrow-up"></i> ${buffer.length > 1 ? `${buffer.length} nouveaux leads` : '1 nouveau lead'} · Afficher</button></div>` : ''}
            <div class="cols label"><span>Lead</span><span class="c-mail">Email</span><span class="c-phone">Téléphone</span><span class="c-note">Note</span><span class="c-quality">${tab === 'out' ? 'Raison' : 'Qualité'}</span><span></span></div>
            ${rows.length ? rows.map(rowHtml).join('') : empty}</div>`
      }

      function otherHtml() {

          <div class="scroll ghost-page"><p class="soft">Vous travaillez ailleurs : la recherche continue. Le menu de gauche montre où elle en est, et la carte en bas à droite vous laisse accepter ou refuser sans quitter cette page.</p>

      function drawerHtml(lead) {
        const decided = lead.place === 'accepted'
        return `<header><span class="mono-avatar" style="width:38px;height:38px">${initials(lead.n)}</span><div style="flex:1;min-width:0"><h2>${lead.n}</h2><p class="soft">${where(lead)}</p></div>

            ${lead.p ? `<div class="fact"><i data-lucide="phone"></i><div><span class="mono">${lead.p}</span><br /><span class="soft">${lead.m ? 'Portable' : 'Fixe'} · fiche Google</span></div></div>` : ''}

               <div class="keys"><span><kbd>A</kbd> · <kbd>R</kbd> · <kbd>S</kbd></span><span><kbd>↑</kbd><kbd>↓</kbd> lead suivant</span></div>`}</footer>`

      function render() {
        const pending = inPlace('pending').length + buffer.length
        document.getElementById('nav-count').textContent = pending || ''

      function goTo(next) {
        page = next

      document.addEventListener('click', (event) => {
        const target = event.target.closest('[data-accept],[data-refuse],[data-aside],[data-restore],[data-undo],[data-flush],[data-tab],[data-auto],[data-page],[data-theme],[data-close],[data-dock],[data-open],#replay')
        if (!target) return
        const data = target.dataset
        if (data.accept) decide(Number(data.accept), 'accepted')
        else if (data.refuse) decide(Number(data.refuse), 'out')
        else if (data.aside) decide(Number(data.aside), 'aside')
        else if (data.restore) decide(Number(data.restore), 'pending')
        else if ('undo' in data) undo()
        else if ('flush' in data) { leads.unshift(...buffer.splice(0)); render() }
        else if (data.tab) { tab = data.tab; openId = null; document.body.classList.remove('has-drawer'); render() }
        else if (data.auto) { auto = data.auto === '1'; if (auto) leads.filter((lead) => lead.place === 'pending' && lead.quality === 'full').forEach((lead) => (lead.place = 'accepted')); render() }
        else if (data.page) goTo(data.page)
        else if (data.theme) { document.documentElement.dataset.theme = data.theme; document.querySelectorAll('#theme-switch button').forEach((button) => button.setAttribute('aria-pressed', String(button === target))) }
        else if ('close' in data) { openId = null; document.body.classList.remove('has-drawer'); render() }
        else if ('dock' in data) { dockOpen = !dockOpen; render() }
        else if (target.id === 'replay') reset()
        else if (data.open) { openId = Number(data.open); document.body.classList.add('has-drawer'); render() }
      })

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase()
        if (key === 'z') return undo()
        if (page !== 'vivier') return
        const rows = inPlace(tab)
        const index = rows.findIndex((lead) => lead.id === openId)
        if (key === 'arrowdown' || key === 'arrowup') {
          event.preventDefault()
          const next = rows[Math.max(0, Math.min(rows.length - 1, index + (key === 'arrowdown' ? 1 : -1)))] || rows[0]
          if (next) { openId = next.id; document.body.classList.add('has-drawer'); render() }
        } else if (openId !== null && key === 'a') decide(openId, 'accepted')
        else if (openId !== null && key === 'r') decide(openId, 'out')
        else if (openId !== null && key === 's') decide(openId, 'aside')
        else if (key === 'escape') { openId = null; document.body.classList.remove('has-drawer'); render() }
      })

      const syncBar = () => document.documentElement.style.setProperty('--bar-height', `${document.querySelector('.mock-bar').offsetHeight + 8}px`)
      addEventListener('resize', syncBar)
      syncBar()
      reset()
    </script>
  </body>
</html>
