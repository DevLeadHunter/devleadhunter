<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maquette · Leads en direct (v4)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f1e9; --sheet: #fbf9f3; --tint: #ede9de; --ink: #1d1a14; --soft: #6e6759; --faint: #b7ae9c;
        --line: #e1dbcc; --line-soft: #eae5d8; --amber: #e8a33c; --amber-ink: #9c6b14; --amber-soft: rgba(232, 163, 60, 0.16);
        --green: #2f7d4e; --green-soft: rgba(47, 125, 78, 0.13); --red: #bf4d33; --red-soft: rgba(191, 77, 51, 0.12);
        --btn: #1d1a14; --btn-text: #fbf9f3; --hover: rgba(29, 26, 20, 0.045);
        --pop: 0 24px 48px -18px rgba(29, 26, 20, 0.3), 0 0 0 1px rgba(29, 26, 20, 0.08);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      :root[data-theme='dark'] {
        --bg: #131312; --sheet: #1b1b1a; --tint: #242423; --ink: #f0efeb; --soft: #a1a09a; --faint: #565550;
        --line: #2b2b29; --line-soft: #232322; --amber-ink: #ecb865; --amber-soft: rgba(232, 163, 60, 0.14);
        --green: #55a878; --green-soft: rgba(85, 168, 120, 0.16); --red: #d76a55; --red-soft: rgba(215, 106, 85, 0.15);
        --btn: #f0efeb; --btn-text: #131312; --hover: rgba(240, 239, 235, 0.05);
        --pop: 0 24px 48px -18px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(240, 239, 235, 0.09);
      }
      * { box-sizing: border-box; margin: 0; }
      body { display: flex; flex-direction: column; height: 100vh; background: var(--bg); color: var(--ink); font: 14px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
      .label { font: 500 11px/1.4 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
      .soft { color: var(--soft); }
      svg { width: 16px; height: 16px; flex: none; }

      .mock-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; background: #111; color: #f3f3f0; font-size: 13px; }
      .mock-bar span { color: #8d8c86; }
      .mock-switch { display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: #262624; }
      .mock-switch button { padding: 4px 11px; border-radius: 999px; color: #b9b8b2; font-weight: 500; }
      .mock-switch button[aria-pressed='true'] { background: #f3f3f0; color: #111; }

      .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
      .side { display: flex; flex-direction: column; padding: 14px 10px 12px 12px; overflow: auto; }
      .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 12px; font-weight: 600; }
      .side .label { padding: 12px 8px 5px; }
      .nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px; border-radius: 8px; color: var(--soft); text-align: left; }
      .nav:hover { background: var(--hover); }
      .nav.is-active { background: var(--sheet); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
      .count { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-ink); font: 500 11px/1.5 'IBM Plex Mono', monospace; text-align: center; }
      .task { margin-top: auto; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); text-align: left; width: 100%; }
      .task b { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      .pulse { position: relative; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--green); }
      .pulse.is-live::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--green); animation: ping 1.4s var(--ease) infinite; }
      @keyframes ping { to { transform: scale(2.6); opacity: 0; } }
      .bar { display: block; height: 4px; border-radius: 999px; background: var(--tint); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 999px; background: var(--ink); transition: width 0.5s var(--ease); }

      .sheet { position: relative; display: flex; flex-direction: column; margin: 8px 8px 8px 0; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); overflow: hidden; transition: margin 0.3s var(--ease); }
      body.has-drawer .sheet { margin-right: 456px; }
      .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-height: 60px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
      .head h1 { font-size: 17px; font-weight: 500; }
      .head .right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 500; white-space: nowrap; transition: opacity 0.15s, transform 0.15s, background 0.15s; }
      .btn:active { transform: translateY(1px); }
      .btn.primary { background: var(--btn); color: var(--btn-text); font-weight: 600; }
      .btn.primary:hover { opacity: 0.88; }
      .btn.secondary { border: 1px solid var(--line); background: var(--sheet); }
      .btn.secondary:hover { background: var(--tint); }
      .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--soft); }
      .icon-btn:hover { background: var(--hover); color: var(--ink); }
      .seg { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
      .seg button { height: 26px; padding: 0 11px; border-radius: 999px; color: var(--soft); font-size: 13px; font-weight: 500; }
      .seg button[aria-pressed='true'] { background: var(--tint); color: var(--ink); }
      .scroll { flex: 1; overflow: auto; }

      .live { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 13px 20px 15px; border-bottom: 1px solid var(--line); }
      .live .what { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 500; }
      .live .what b { font-weight: 500; white-space: nowrap; }
      .live .what span { color: var(--soft); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live .now { padding-left: 18px; color: var(--soft); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .live .side-info { grid-row: span 2; display: flex; align-items: center; gap: 12px; color: var(--soft); font-size: 12.5px; }
      .live .scan { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--ink); transition: width 0.5s var(--ease); }
      .pipe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 20px; }
      .pipe button { padding: 15px 0 12px; text-align: left; }
      .pipe b { display: block; font: 500 26px/1.1 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
      .pipe span { display: flex; align-items: center; gap: 7px; margin-top: 3px; color: var(--soft); font-size: 12.5px; }
      .pipe i { width: 8px; height: 8px; border-radius: 2px; }
      .stack { display: flex; gap: 2px; height: 6px; margin: 0 20px 16px; border-radius: 999px; overflow: hidden; background: var(--tint); }
      .stack i { height: 100%; transition: flex-grow 0.5s var(--ease); }
      .c-wait { background: var(--amber); } .c-yes { background: var(--green); } .c-aside { background: var(--soft); } .c-out { background: var(--faint); }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; min-height: 48px; padding: 0 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .tab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 48px; color: var(--soft); font-weight: 500; }
      .tab[aria-selected='true'] { color: var(--ink); }
      .tab[aria-selected='true']::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
      .tab em { padding: 0 6px; border-radius: 999px; background: var(--tint); font: 500 11px/1.6 'IBM Plex Mono', monospace; font-style: normal; }
      .toolbar .right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      .chip { height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--soft); font-size: 13px; }
      .chip[aria-pressed='true'] { border-color: var(--ink); color: var(--ink); background: var(--tint); }

      .fresh { display: flex; justify-content: center; padding: 8px; border-bottom: 1px solid var(--line-soft); background: var(--amber-soft); }
      .fresh button { display: inline-flex; align-items: center; gap: 8px; color: var(--amber-ink); font-weight: 500; }
      .cols, .row { display: grid; grid-template-columns: minmax(210px, 1.6fr) minmax(190px, 1.3fr) 132px 92px 92px; align-items: center; gap: 14px; padding: 0 20px 0 17px; }
      .cols { height: 36px; border-bottom: 1px solid var(--line-soft); border-left: 3px solid transparent; }
      .row { min-height: 60px; border-bottom: 1px solid var(--line-soft); border-left: 3px solid var(--faint); cursor: pointer; transition: background 0.15s; }
      .row:hover { background: var(--hover); }
      .row.is-open { background: var(--tint); }
      .row.q-full { border-left-color: var(--green); }
      .row.q-check { border-left-color: var(--amber); }
      .row.is-new { animation: arrive 1.6s var(--ease); }
      @keyframes arrive { from { background: var(--amber-soft); transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; transform: none; } to { background: transparent; } }
      .who { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .avatar { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border: 1px solid var(--line); border-radius: 50%; background: var(--tint); font: 600 11px 'IBM Plex Sans', sans-serif; letter-spacing: 0.02em; }
      .cell { min-width: 0; }
      .cell > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cell small { display: block; color: var(--soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .name { font-weight: 600; }
      .ticks { display: flex; gap: 5px; }
      .tick { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); color: var(--faint); }
      .tick svg { width: 13px; height: 13px; }
      .tick.ok { background: var(--green-soft); color: var(--green); }
      .tick.unsure { background: var(--amber-soft); color: var(--amber-ink); }
      .tick.bad { background: var(--red-soft); color: var(--red); }
      .acts { display: flex; justify-content: flex-end; gap: 6px; }
      .round { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); transition: transform 0.12s; }
      .round:hover { transform: scale(1.07); }
      .round.yes { border-color: var(--btn); background: var(--btn); color: var(--btn-text); }
      .state { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); font-size: 12.5px; }
      .state svg { width: 14px; height: 14px; color: var(--green); }
      .empty { padding: 64px 20px; text-align: center; color: var(--soft); }
      .empty i { display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%; background: var(--tint); color: var(--ink); }
      .empty b { display: block; color: var(--ink); font-size: 15px; font-weight: 500; }

      .drawer { position: fixed; top: var(--bar-height, 52px); right: 8px; bottom: 8px; z-index: 30; display: flex; flex-direction: column; width: 440px; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); transform: translateX(calc(100% + 16px)); transition: transform 0.3s var(--ease); }
      body.has-drawer .drawer { transform: none; }
      .drawer header { display: flex; align-items: center; gap: 12px; padding: 16px 12px 16px 18px; border-bottom: 1px solid var(--line); }
      .drawer h2 { font-size: 16px; font-weight: 600; }
      .drawer .body { flex: 1; overflow: auto; padding: 14px 18px 16px; }
      .check { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
      .check:last-of-type { border-bottom: 0; }
      .check p { color: var(--soft); font-size: 12.5px; }
      .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .links .btn { height: 32px; padding: 0 12px; font-size: 13px; }
      .drawer footer { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
      .drawer footer .btn { height: 42px; padding: 0 8px; }
      .done { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 500; }

      .toast { position: fixed; left: 50%; bottom: 22px; z-index: 70; display: flex; align-items: center; gap: 14px; padding: 9px 10px 9px 16px; border-radius: 999px; background: var(--btn); color: var(--btn-text); box-shadow: var(--pop); transform: translate(-50%, 80px); opacity: 0; transition: transform 0.3s var(--ease), opacity 0.2s; }
      .toast.is-on { transform: translate(-50%, 0); opacity: 1; }
      .toast button { height: 28px; padding: 0 12px; border-radius: 999px; background: color-mix(in srgb, var(--btn-text) 14%, transparent); color: var(--btn-text); font-weight: 500; }

      /* Barre de suivi sur les autres pages : large et basse */
      .dock { position: absolute; left: 50%; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 14px; width: min(920px, calc(100% - 32px)); min-height: 60px; padding: 9px 10px 9px 16px; border-radius: 16px; background: var(--sheet); box-shadow: var(--pop); transform: translateX(-50%); }
      .dock .status { display: flex; flex-direction: column; flex: none; padding-right: 14px; border-right: 1px solid var(--line); }
      .dock .status b { display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; }
      .dock .status small { padding-left: 16px; color: var(--soft); font-size: 12px; white-space: nowrap; }
      .dock .who { flex: 1; }
      .dock .btn { height: 36px; }
      .dock.is-folded { left: auto; right: 16px; width: auto; min-height: 44px; padding: 0 6px 0 16px; border-radius: 999px; transform: none; }
      .dock .lead-in { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; animation: arrive 1.1s var(--ease); }
      .ghost-page { padding: 22px 20px 110px; }
      .ghost-page .sk { height: 46px; margin-top: 8px; border-radius: 8px; background: var(--tint); opacity: 0.6; }

      /* Nouvelle recherche */
      .form { max-width: 860px; margin: 0 auto; padding: 8px 24px 24px; }
      .field { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 8px 24px; padding: 20px 0; border-bottom: 1px solid var(--line-soft); }
      .field:last-child { border-bottom: 0; }
      .field h3 { font-size: 14px; font-weight: 600; }
      .field h3 + p { margin-top: 2px; color: var(--soft); font-size: 12.5px; }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
      .opt:hover { background: var(--hover); }
      .opt svg { width: 14px; height: 14px; }
      .opt[aria-pressed='true'] { border-color: var(--btn); background: var(--btn); color: var(--btn-text); }
      .opt.add { border-style: dashed; color: var(--soft); }
      .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .card-opt { padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; text-align: left; transition: border-color 0.15s, background 0.15s; }
      .card-opt b { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .card-opt p { margin-top: 5px; color: var(--soft); font-size: 12.5px; }
      .card-opt[aria-pressed='true'] { border-color: var(--ink); background: var(--tint); box-shadow: inset 0 0 0 1px var(--ink); }
      .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
      .stepper button { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; }
      .stepper button:hover { background: var(--hover); }
      .stepper output { min-width: 34px; text-align: center; font: 500 16px 'IBM Plex Mono', monospace; }
      .recent { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-align: left; }
      .recent + .recent { margin-top: 8px; }
      .recent:hover { background: var(--hover); }
      .recent span { flex: 1; min-width: 0; }
      .recent small { color: var(--soft); white-space: nowrap; }
      .launch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--sheet); }
      .launch p { flex: 1; min-width: 240px; }
      .launch p b { font-weight: 600; }
      .launch small { display: block; margin-top: 2px; color: var(--soft); font-size: 12.5px; }
      .launch .btn { height: 42px; padding: 0 20px; }

      body.has-drawer .cols, body.has-drawer .row { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1.2fr) 132px 84px; }
      body.has-drawer .c-note { display: none; }
      @media (max-width: 1240px) {
        .cols, .row { grid-template-columns: minmax(180px, 1.5fr) minmax(160px, 1.1fr) 132px 92px; }
        .c-note { display: none; }
        body.has-drawer .cols, body.has-drawer .row { grid-template-columns: minmax(0, 1fr) 92px; }
        body.has-drawer .c-contact, body.has-drawer .c-ticks { display: none; }
        .toolbar .chip { display: none; }
        .field { grid-template-columns: 1fr; }
      }
      @media (max-width: 860px) {
        body { height: auto; }
        .app { grid-template-columns: 1fr; }
        .side { display: none; }
        .sheet, body.has-drawer .sheet { margin: 8px; min-height: 80vh; }
        .cols { display: none; }
        .row, body.has-drawer .row { grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px 10px 11px; }
        .c-contact, .c-ticks { display: none; }
        .live .side-info span { display: none; }
        .cards { grid-template-columns: 1fr; }
        .drawer { left: 8px; width: auto; }
        .dock .status small, .dock .c-ticks { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="mock-bar">
      <strong>Maquette</strong>
      <div class="mock-switch" id="page-switch">
        <button data-page="leads" aria-pressed="true">Page des leads</button>
        <button data-page="new" aria-pressed="false">Nouvelle recherche</button>
        <button data-page="other" aria-pressed="false">Une autre page</button>
      </div>
      <span>Nom du menu</span>
      <div class="mock-switch" id="name-switch">
        <button data-name="0" aria-pressed="true">Leads</button>
        <button data-name="1" aria-pressed="false">Radar</button>
        <button data-name="2" aria-pressed="false">Chasse</button>
      </div>
      <div class="mock-switch" id="theme-switch">
        <button data-theme="light" aria-pressed="true">Clair</button>
        <button data-theme="dark" aria-pressed="false">Sombre</button>
      </div>
      <button class="btn" id="replay" style="height:28px;border:1px solid #3a3a37;color:#f3f3f0">Rejouer</button>
    </div>

    <div class="app">
      <aside class="side">
        <div class="brand"><i data-lucide="hexagon"></i> devleadhunter</div>
        <p class="label">Pilotage</p>
        <button class="nav"><i data-lucide="layout-dashboard"></i> Tableau de bord</button>
        <button class="nav"><i data-lucide="workflow"></i> Automatisations</button>
        <p class="label">Prospection</p>
        <button class="nav" data-page="leads" id="nav-leads"></button>
        <button class="nav"><i data-lucide="users"></i> Mes prospects</button>
        <button class="nav"><i data-lucide="app-window"></i> Sites démo</button>
        <button class="nav" data-page="other" id="nav-other"><i data-lucide="megaphone"></i> Campagnes</button>
        <button class="nav"><i data-lucide="send"></i> Suivi des emails</button>
        <button class="nav"><i data-lucide="banknote"></i> Ventes</button>
        <button class="task" data-page="leads" id="task"></button>
      </aside>
      <main class="sheet" id="sheet"></main>
    </div>

    <aside class="drawer" id="drawer" aria-label="Fiche du lead"></aside>
    <div class="toast" id="toast" role="status"></div>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>

      const NAMES = [['Leads', 'radar'], ['Radar', 'radar'], ['Chasse', 'crosshair']]

      const TRADES = ['Paysagiste', 'Électricien', 'Plombier-chauffagiste', 'Garage automobile', 'Couvreur', 'Menuisier', 'Barbier', 'Food truck']
      const CHANNELS = [['Email', 'mail', 'Un email prouvé pour chaque lead.'], ['SMS', 'smartphone', 'Un numéro de portable pour chaque lead.'], ['Email et portable', 'messages-square', 'Les deux : le canal se choisit à la campagne.']]
      const TOTAL = 69
      const PLACE = { kept: 'pending', to_confirm: 'pending', set_aside: 'aside', rejected: 'out' }
      const QUALITY = { kept: 'full', to_confirm: 'check', set_aside: 'part', rejected: 'none' }

      let leads, queue, buffer, timer, checked, lastAction = null
      let page = 'leads', tab = 'pending', trade = 'all', openId = null, auto = false, nameIndex = 0, dockFolded = false
      const form = { trades: new Set(['Paysagiste', 'Électricien']), count: 3, country: 'France', towns: 'all', channel: 2, noSite: true, rating: '4,0' }

      function reset() {
        const all = SOURCE.rows.filter((row) => PLACE[row.s]).map((row, id) => ({ ...row, id, place: PLACE[row.s], quality: QUALITY[row.s], by: 'app' }))
        const first = new Set([0, 6, 8, 9, 10, 14, 15, 16])
        leads = all.filter((lead) => first.has(lead.id))
        queue = all.filter((lead) => !first.has(lead.id)).sort((a, b) => ((a.id * 7) % 11) - ((b.id * 7) % 11))
        buffer = []; checked = 31; openId = null; lastAction = null
        document.body.classList.remove('has-drawer')
        clearInterval(timer)
        timer = setInterval(arrive, 3400)
        render()
      }

      const running = () => queue.length > 0
      const inPlace = (place) => leads.filter((lead) => lead.place === place && (trade === 'all' || lead.t === trade))

      function criteria(lead) {

        const siteUnsure = (lead.d || '').startsWith('Un site est déclaré')
        return [
          ['mail', lead.e ? (lead.pl === 'c' ? 'unsure' : 'ok') : 'none', lead.e ? `Email ${PROOF[lead.pl]}` : 'Pas d’email trouvé', lead.e || 'Nom, numéro et page Facebook cherchés'],
          ['smartphone', lead.m ? 'ok' : 'none', lead.m ? 'Portable' : lead.p ? 'Téléphone fixe seulement' : 'Pas de téléphone', lead.p || '—'],
          ['globe', hasSite ? 'bad' : siteUnsure ? 'unsure' : 'ok', hasSite ? 'A déjà un site' : siteUnsure ? 'Un site est déclaré mais introuvable' : 'Aucun site web', hasSite ? (lead.d || '').replace('A déjà un site : ', '') : 'Recherche « nom + ville », domaine de l’email et page Facebook contrôlés'],

        ]
      }
      const ticks = (lead) => `<span class="ticks">${criteria(lead).map(([icon, state, title]) => `<span class="tick ${state}" title="${title}"><i data-lucide="${icon}"></i></span>`).join('')}</span>`

      function arrive() {
        const lead = queue.shift()
        if (!lead) { clearInterval(timer); render(); return }
        checked = Math.min(TOTAL, checked + 4)
        lead.isNew = true
        if (auto && lead.quality === 'full') { lead.place = 'accepted'; leads.unshift(lead) }
        else if (lead.place === 'pending' && page === 'leads' && tab === 'pending') buffer.push(lead)
        else leads.unshift(lead)
        if (!queue.length) checked = TOTAL
        render()
      }

      function decide(id, place) {
        const lead = leads.find((item) => item.id === id)
        if (!lead) return
        const visible = inPlace(tab)
        const next = visible[visible.indexOf(lead) + 1] || visible[visible.indexOf(lead) - 1]
        lastAction = [{ id, from: lead.place, by: lead.by }]
        lead.place = place; lead.by = 'you'; lead.isNew = false
        toast(place === 'accepted' ? `${lead.n} accepté, ajouté à Mes prospects` : place === 'out' ? `${lead.n} refusé` : place === 'aside' ? `${lead.n} mis de côté` : `${lead.n} remis à valider`, true)
        if (openId === id) openId = next ? next.id : null
        if (openId === null) document.body.classList.remove('has-drawer')
        render()
      }

      function acceptAllFull() {
        const full = inPlace('pending').filter((lead) => lead.quality === 'full')
        lastAction = full.map((lead) => ({ id: lead.id, from: lead.place, by: lead.by }))
        full.forEach((lead) => { lead.place = 'accepted'; lead.by = 'you' })
        toast(`${full.length} leads complets acceptés`, true)
        openId = null; document.body.classList.remove('has-drawer'); render()
      }

      function undo() {
        if (!lastAction) return
        lastAction.forEach((action) => { const lead = leads.find((item) => item.id === action.id); lead.place = action.from; lead.by = action.by })
        lastAction = null; toast('Décision annulée', false); render()
      }

      let toastTimer
      function toast(text, canUndo) {

        node.innerHTML = `<span>${text}</span>${canUndo ? '<button data-undo>Annuler</button>' : ''}`
        node.classList.add('is-on'); clearTimeout(toastTimer)
        toastTimer = setTimeout(() => node.classList.remove('is-on'), 5000)
      }

      function rowHtml(lead) {

      }

      function leadsHtml() {

        const fullCount = inPlace('pending').filter((lead) => lead.quality === 'full').length

              <div class="now mono">69 fiches vérifiées · villes parcourues : Limoges, Albi</div></div>`
        const pipe = [['pending', 'À valider', 'c-wait'], ['accepted', 'Acceptés', 'c-yes'], ['aside', 'De côté', 'c-aside'], ['out', 'Écartés', 'c-out']]
        const empty = tab === 'pending'

        return `<div class="head"><h1>${NAMES[nameIndex][0]}</h1>

          <div class="scroll">${live}
            <div class="pipe">${pipe.map(([key, title, color]) => `<button data-tab="${key}"><b>${countOf(key) + (key === 'pending' ? buffer.length : 0)}</b><span><i class="${color}"></i>${title}</span></button>`).join('')}</div>
            <div class="stack">${pipe.map(([key, , color]) => `<i class="${color}" style="flex-grow:${countOf(key) + (key === 'pending' ? buffer.length : 0)}"></i>`).join('')}</div>
            <div class="toolbar" role="tablist">${TABS.map(([key, title]) => `<button class="tab" role="tab" data-tab="${key}" aria-selected="${key === tab}">${title}<em>${countOf(key)}</em></button>`).join('')}

            ${buffer.length ? `<div class="fresh"><button data-flush><i data-lucide="arrow-up"></i> ${buffer.length > 1 ? `${buffer.length} nouveaux leads` : '1 nouveau lead'} à afficher</button></div>` : ''}

            ${rows.length ? rows.map(rowHtml).join('') : empty}</div>`
      }

      function summary() {
        const trades = [...form.trades]
        const requests = 60 + 45 * form.count * Math.max(trades.length, 1)
        const cost = (requests * 0.0015).toFixed(2).replace('.', ',')
        const who = trades.length ? trades.map((name) => `${form.count} ${name.toLowerCase()}${form.count > 1 ? 's' : ''}`).join(', ') : 'aucun métier choisi'
        return { who, requests, cost }
      }

      function newHtml() {

              <button class="opt add"><i data-lucide="plus"></i> Autre métier</button></div></div>
            <div class="field"><div><h3>Combien par métier</h3><p>La recherche s’arrête quand le compte est atteint.</p></div><div class="opts">

              ${[3, 5, 10, 20].map((value) => `<button class="opt" data-count="${value}" aria-pressed="${form.count === value}">${value}</button>`).join('')}</div></div>
            <div class="field"><div><h3>Où</h3><p>Sans ville, l’app choisit et change de ville jusqu’au compte.</p></div><div>
              <div class="opts">${['France', 'Suisse', 'Belgique', 'Québec'].map((name) => `<button class="opt" data-country="${name}" aria-pressed="${form.country === name}">${name}</button>`).join('')}</div>
              <div class="opts" style="margin-top:10px"><button class="opt" data-towns="all" aria-pressed="${form.towns === 'all'}">Partout dans le pays</button><button class="opt" data-towns="some" aria-pressed="${form.towns === 'some'}">Des villes précises</button>

            <div class="field"><div><h3>Comment les joindre</h3><p>Un lead qui n’a que l’autre moyen est mis de côté, jamais perdu.</p></div><div class="cards">
              ${CHANNELS.map(([title, icon, text], index) => `<button class="card-opt" data-channel="${index}" aria-pressed="${form.channel === index}"><b><i data-lucide="${icon}"></i>${title}</b><p>${text}</p></button>`).join('')}</div></div>
            <div class="field"><div><h3>Critères</h3><p>Chaque lead arrive avec ses critères vérifiés.</p></div><div class="opts">
              <button class="opt" data-site aria-pressed="${form.noSite}">${form.noSite ? '<i data-lucide="check"></i>' : ''}Sans site web</button>
              ${['Toutes les notes', '3,5', '4,0', '4,5'].map((value) => `<button class="opt" data-rating="${value}" aria-pressed="${form.rating === value}">${value === 'Toutes les notes' ? value : `Note ${value} ou plus`}</button>`).join('')}</div></div>
          </div></div>
          <div class="launch"><p><b>${who}</b> · ${form.country}${form.towns === 'some' ? ' (Limoges)' : ''} · ${CHANNELS[form.channel][0].toLowerCase()}${form.noSite ? ' · sans site web' : ''}
              <small>Au plus ${requests} requêtes, environ ${cost} $ · 5 à 10 minutes · vous pouvez quitter la page pendant la recherche</small></p>
            <button class="btn primary" data-launch ${form.trades.size ? '' : 'disabled style="opacity:.5"'}><i data-lucide="search"></i> Lancer la recherche</button></div>`
      }

      function dockHtml() {
        const waiting = leads.filter((lead) => lead.place === 'pending')
        if (!waiting.length && !running()) return ''
        const status = `<div class="status"><b><i class="pulse ${running() ? 'is-live' : ''}"></i>${running() ? 'Recherche en cours' : 'Recherche terminée'}</b><small>${waiting.length} à valider · ${countOf('accepted')} acceptés</small></div>`
        if (dockFolded) return `<div class="dock is-folded"><b style="display:flex;align-items:center;gap:8px;font-weight:500"><i class="pulse ${running() ? 'is-live' : ''}"></i>${waiting.length} à valider</b><button class="icon-btn" data-fold title="Déplier"><i data-lucide="chevron-up"></i></button></div>`
        const lead = waiting[0]
        const middle = lead
          ? `<div class="lead-in" data-key="${lead.id}"><div class="who"><span class="avatar">${initials(lead.n)}</span><div class="cell"><span class="name">${lead.n}</span><small>${where(lead)}</small></div></div>
              <span class="c-ticks">${ticks(lead)}</span>
              <button class="btn secondary" data-refuse="${lead.id}">Refuser</button><button class="btn primary" data-accept="${lead.id}"><i data-lucide="check"></i> Accepter</button></div>`
          : '<div class="lead-in soft" style="flex:1">Rien à valider pour l’instant. Le prochain lead s’affichera ici.</div>'
        return `<div class="dock">${status}${middle}<button class="icon-btn" data-page="leads" title="Ouvrir la page des leads"><i data-lucide="maximize-2"></i></button><button class="icon-btn" data-fold title="Replier"><i data-lucide="chevron-down"></i></button></div>`
      }

      function otherHtml() {
        return `<div class="head"><h1>Campagnes</h1><div class="right"><button class="btn secondary"><i data-lucide="plus"></i> Nouvelle campagne</button></div></div>
          <div class="scroll ghost-page"><p class="soft">Vous travaillez sur une autre page : la recherche continue. Le menu montre où elle en est, et la barre du bas vous présente chaque lead à valider.</p>
            ${'<div class="sk"></div>'.repeat(7)}</div>${dockHtml()}`
      }

      function drawerHtml(lead) {
        return `<header><span class="avatar" style="width:40px;height:40px">${initials(lead.n)}</span><div style="flex:1;min-width:0"><h2>${lead.n}</h2><p class="soft">${where(lead)}</p></div>
            <button class="icon-btn" data-close title="Fermer"><i data-lucide="x"></i></button></header>
          <div class="body"><p class="label">Critères vérifiés</p>
            ${criteria(lead).map(([icon, state, title, detail]) => `<div class="check"><span class="tick ${state}"><i data-lucide="${icon}"></i></span><div><b style="font-weight:500">${title}</b><p class="${icon === 'mail' || icon === 'smartphone' ? 'mono' : ''}">${detail}</p></div></div>`).join('')}
            ${lead.d && lead.place !== 'out' ? `<p style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber-ink)">${lead.d}</p>` : ''}
            <div class="links"><button class="btn secondary"><i data-lucide="map-pin"></i> Fiche Google <i data-lucide="external-link"></i></button>
              ${lead.fb ? '<button class="btn secondary"><i data-lucide="facebook"></i> Page Facebook <i data-lucide="external-link"></i></button>' : ''}</div></div>
          <footer>${lead.place === 'accepted'
            ? '<div class="done"><i data-lucide="check"></i> Accepté · prospect créé</div>'
            : `<button class="btn primary" data-accept="${lead.id}"><i data-lucide="check"></i> Accepter</button><button class="btn secondary" data-refuse="${lead.id}">Refuser</button><button class="btn secondary" data-aside="${lead.id}">De côté</button>`}</footer>`
      }

      function render() {
        const pending = countOf('pending') + buffer.length
        const [name, icon] = NAMES[nameIndex]
        document.getElementById('nav-leads').innerHTML = `<i data-lucide="${icon}"></i> ${name} ${pending ? `<span class="count">${pending}</span>` : ''}`
        document.getElementById('nav-leads').classList.toggle('is-active', page !== 'other')
        document.getElementById('nav-other').classList.toggle('is-active', page === 'other')
        document.getElementById('task').innerHTML = `<b><i class="pulse ${running() ? 'is-live' : ''}"></i> ${running() ? 'Recherche en cours' : 'Recherche terminée'}</b>
          <span class="soft" style="display:block;margin:4px 0 9px;font-size:12.5px">${countOf('accepted')} acceptés · ${pending} à valider</span>
          <span class="bar"><i style="width:${Math.round((checked / TOTAL) * 100)}%"></i></span>`
        const sheet = document.getElementById('sheet')
        const scrollTop = sheet.querySelector('.scroll')?.scrollTop || 0
        sheet.innerHTML = { leads: leadsHtml, new: newHtml, other: otherHtml }[page]()
        if (sheet.querySelector('.scroll')) sheet.querySelector('.scroll').scrollTop = scrollTop
        const open = leads.find((lead) => lead.id === openId)
        if (open && page === 'leads') document.getElementById('drawer').innerHTML = drawerHtml(open)
        leads.forEach((lead) => { if (lead.isNew) setTimeout(() => (lead.isNew = false), 1700) })
        lucide.createIcons()
      }

      function goTo(next) {
        page = next
        if (page !== 'leads') { document.body.classList.remove('has-drawer'); openId = null; leads.unshift(...buffer.splice(0)) }
        document.querySelectorAll('#page-switch button').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.page === page)))
        render()
      }

      const pressed = (selector, target) => document.querySelectorAll(selector).forEach((button) => button.setAttribute('aria-pressed', String(button === target)))
      document.addEventListener('click', (event) => {
        const target = event.target.closest('button, .row')
        if (!target) return
        const data = target.dataset
        if (data.accept) decide(Number(data.accept), 'accepted')
        else if (data.refuse) decide(Number(data.refuse), 'out')
        else if (data.aside) decide(Number(data.aside), 'aside')
        else if (data.restore) decide(Number(data.restore), 'pending')
        else if ('undo' in data) undo()
        else if ('all' in data) acceptAllFull()
        else if ('flush' in data) { leads.unshift(...buffer.splice(0)); render() }
        else if (data.tab) { tab = data.tab; openId = null; document.body.classList.remove('has-drawer'); render() }
        else if (data.trade) { trade = data.trade; render() }
        else if (data.auto) { auto = data.auto === '1'; if (auto) leads.filter((lead) => lead.place === 'pending' && lead.quality === 'full').forEach((lead) => (lead.place = 'accepted')); render() }
        else if ('launch' in data) { page = 'leads'; tab = 'pending'; pressed('#page-switch button', document.querySelector('#page-switch [data-page="leads"]')); reset() }
        else if (data.page) goTo(data.page)
        else if (data.name) { nameIndex = Number(data.name); pressed('#name-switch button', target); render() }
        else if (data.theme) { document.documentElement.dataset.theme = data.theme; pressed('#theme-switch button', target) }
        else if (data.pick) { form.trades.has(data.pick) ? form.trades.delete(data.pick) : form.trades.add(data.pick); render() }
        else if (data.step) { form.count = Math.max(1, Math.min(50, form.count + Number(data.step))); render() }
        else if (data.count) { form.count = Number(data.count); render() }
        else if (data.country) { form.country = data.country; render() }
        else if (data.towns) { form.towns = data.towns; render() }
        else if (data.channel) { form.channel = Number(data.channel); render() }
        else if ('site' in data) { form.noSite = !form.noSite; render() }
        else if (data.rating) { form.rating = data.rating; render() }
        else if ('fold' in data) { dockFolded = !dockFolded; render() }
        else if ('close' in data) { openId = null; document.body.classList.remove('has-drawer'); render() }
        else if (target.id === 'replay') reset()
        else if (data.open) { openId = Number(data.open); document.body.classList.add('has-drawer'); render() }
      })

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase()
        if (key === 'z') return undo()
        if (page !== 'leads') return
        const rows = inPlace(tab)
        const index = rows.findIndex((lead) => lead.id === openId)
        if (key === 'arrowdown' || key === 'arrowup') {
          event.preventDefault()
          const next = rows[Math.max(0, Math.min(rows.length - 1, index + (key === 'arrowdown' ? 1 : -1)))] || rows[0]
          if (next) { openId = next.id; document.body.classList.add('has-drawer'); render() }
        } else if (openId !== null && key === 'a') decide(openId, 'accepted')
        else if (openId !== null && key === 'r') decide(openId, 'out')
        else if (openId !== null && key === 's') decide(openId, 'aside')
        else if (key === 'escape') { openId = null; document.body.classList.remove('has-drawer'); render() }
      })

      const syncBar = () => document.documentElement.style.setProperty('--bar-height', `${document.querySelector('.mock-bar').offsetHeight + 8}px`)
      addEventListener('resize', syncBar)
      syncBar()
      reset()
    </script>
  </body>
</html>
